<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="techBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background rounded rectangle for contrast in standalone app icon -->
  <rect width="100" height="100" rx="24" fill="#0A192F" />
  
  <!-- Subtle grid pattern inside icon -->
  <path d="M20 50h60M50 20v60" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Monogram A: Left tech blue stem with network dot -->
  <path d="M50 18 L24 78 H38 L50 48 L62 78 H76 L50 18 Z" fill="url(#techBlueGrad)" filter="url(#glow)" />
  
  <!-- Inner triangle cutout -->
  <path d="M50 34 L38 64 H62 L50 34 Z" fill="#0A192F" />
  
  <!-- Gold Logistics & Trade crossbar / pulse line -->
  <path d="M30 62 Q50 54 70 62 L66 69 Q50 63 34 69 Z" fill="url(#goldGrad)" />
  
  <!-- Digital Core Node -->
  <circle cx="50" cy="46" r="4.5" fill="#F8FAFC" />
  <circle cx="50" cy="46" r="2.5" fill="#2563EB" />
</svg>
